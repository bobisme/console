[package]
name = "console-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "console-agent"
path = "src/main.rs"

[dependencies]
console-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
gif = { version = "0.14", default-features = false, features = ["std", "color_quant"] }
