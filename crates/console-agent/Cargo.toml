[package]
name = "console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "console"
path = "src/main.rs"

[lib]
name = "console_agent"
path = "src/lib.rs"

[dependencies]
console-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.18"
gif = { version = "0.14", default-features = false, features = ["std", "color_quant"] }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
cpal = "0.18.1"
